<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Calendario para Lucero 🎄</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 15px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1b2735 0%, #090a0f 100%);
    color: #ffffff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Nieve siempre detrás de todo */
  .snow-container {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .snowflake {
    position: absolute;
    top: -10%;
    color: rgba(255, 255, 255, 0.75);
    user-select: none;
    animation: caer linear infinite;
  }
  @keyframes caer {
    0% { transform: translateY(-10vh) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }

  /* Contenedor principal siempre delante */
  .contenedor {
    position: relative;
    z-index: 10;
    max-width: 720px;
    margin: 0 auto;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    margin-bottom: 15px;
    text-shadow: 0 2px 10px rgba(255, 215, 0, 0.4);
  }

  #contador {
    text-align: center;
    color: #FFD700;
    font-size: 17px;
    font-weight: bold;
    padding: 10px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 12px;
    border: 1px solid #FFD700;
    margin-bottom: 16px;
  }

  .btn-intro {
    width: 100%;
    padding: 14px;
    font-size: 17px;
    font-weight: bold;
    background: #262730;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 18px;
    transition: transform 0.15s, background 0.2s;
  }
  .btn-intro:hover { background: #343642; transform: scale(1.01); }

  /* Tarjeta superior para introducción y sorpresas */
  .tarjeta {
    background: rgba(22, 26, 36, 0.96);
    border: 1px solid rgba(255, 215, 0, 0.5);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.65);
    animation: aparecer 0.25s ease;
  }
  @keyframes aparecer {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tarjeta h2 { margin-top: 0; color: #FFD700; }
  .tarjeta p { line-height: 1.6; font-size: 16px; white-space: pre-line; }
  .tarjeta img, .tarjeta video {
    width: 100%;
    border-radius: 12px;
    margin: 12px 0;
    display: block;
  }
  .aviso {
    background: rgba(255, 193, 7, 0.15);
    border-left: 4px solid #ffc107;
    padding: 12px 15px;
    border-radius: 8px;
    color: #ffe082;
    font-weight: bold;
    margin: 10px 0;
  }
  .btn-mapa {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px;
    background: #1e88e5;
    color: white;
    text-decoration: none;
    font-weight: bold;
    border-radius: 10px;
    margin-top: 8px;
  }
  .btn-cerrar {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #3a3f4b;
    color: #fff;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
  }

  /* Cuadrícula de 4 columnas (3 en móviles pequeños) */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    align-items: center;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  }

  .btn-dia {
    background: #262730;
    color: #ffffff;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    transition: transform 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
  }
  .btn-dia:hover { transform: scale(1.03); }

  /* Botones pendientes en gris */
  .btn-pendiente {
    background-color: #4a4e54 !important;
    color: #b0b5bc !important;
    border: 1px dashed #7a808a !important;
    opacity: 0.75;
  }

  @keyframes brilloDorado {
    0% { box-shadow: 0 0 6px #FFD700; border-color: #FFD700; transform: scale(1); }
    50% { box-shadow: 0 0 22px #FFD700, 0 0 10px #FFF8DC; border-color: #FFF8DC; transform: scale(1.04); }
    100% { box-shadow: 0 0 6px #FFD700; border-color: #FFD700; transform: scale(1); }
  }
  .btn-hoy {
    background: #ff4b4b;
    border: 2px solid #FFD700;
    animation: brilloDorado 1.8s infinite;
  }
  .btn-24 {
    border: 2px solid #FFD700;
    font-size: 20px;
    background: linear-gradient(135deg, #2b2d38, #3b3219);
  }
</style>
</head>
<body>

<div class="snow-container" id="nieve"></div>

<div class="contenedor">
  <h1>🎄 Calendario para Lucero 🎄</h1>
  <div id="contador">Calculando tiempo para las 20:11...</div>

  <button class="btn-intro" onclick="abrirIntro()">💌 Lee esto primero</button>

  <div id="zona-tarjeta"></div>

  <div class="grid" id="cuadricula"></div>
</div>

<script>
  // Configuración (en diciembre cambia MES_OBJETIVO = 12)
  const MES_OBJETIVO = 11;
  const HORA_APERTURA = 20;
  const MINUTO_APERTURA = 11;

  // Diccionario de sorpresas (borra 'pendiente: true' cuando rellenes cada día)
  const sorpresas = {
    1: {
      texto: 'Cuando te digo que te quiero me refiero a él',

    },
    2: {

    },

    },
    4: {
      texto: 'Eres la persona con la que no me importa hacer cosas asi: ',
      foto: 'fotos/beso garaje.jpg'
    },
    5: {
      texto: 'Y me encanta hacer cosas asi tambien:',
      foto: 'fotos/juntos parque ft.jpeg'
    },
    6: {
      texto: 'No se cuantos besos nos quedaran pero espero que sean todos los que tengamos y algunos más',
      video: 'Videos/videos besos 1 (1).mp4'
    },
    7: {
      texto: 'Tampoco cuantas tonterias nos quedaran',
      video: 'Videos/Videos tonterias nuestras.mp4'
    },
    8: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    },
    9: {
      texto: 'Gracias por aguantar mis tonterias como esta',
      foto: 'fotos/yo calvo.jpg'
    },
    10: {
      texto: 'Me encanta cuando me besas, de verdad, te quiero mucho por todo',
      video: 'Videos/videos besos 3.mp4'
    },
    11: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    },
    12: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    },
    13: {
      texto: "Me encanta estar contigo en cualquier lugar, aunque no nos dejen volver a ese Domino's jajaja",
      video: 'Videos/video pizza.mp4',
      ubicacion: "https://www.google.com/maps/place/Domino's+Pizza/@40.37807,-3.7715649,17z/data=!4m14!1m7!3m6!1s0xd41884f2d8a2a6d:0xce315a1e93f284ad!2sDomino's+Pizza!8m2!3d40.37807!4d-3.76899!16s%2Fg%2F12qhjgqrj!3m5!1s0xd41884f2d8a2a6d:0xce315a1e93f284ad!8m2!3d40.37807!4d-3.76899!16s%2Fg%2F12qhjgqrj?entry=ttu&g_ep=EgoyMDI2MTEyMi4wIKXMDSoASAFQAw%3D%3D"
    },
    14: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    },
    15: {
      texto: 'Contigo aprendi a que puede que no salga tan mal en las fotos',
      foto: 'fotos/foto mia espejo criminal ruso.jpeg'
    },
    16: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    },
    17: {
      texto: 'Aunque llevamos juntos solo 3 meses y 5 días me encanta estar contigo',
      video: 'Videos/videos besos 2.mp4'
    },
    18: {
      texto: 'Y me encanta sacarme fotos contigo aunque no me dejes subir todas',
      foto: 'fotos/foto juntos espejo 1.jpg'
    },
    19: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    },
    20: {
      texto: 'Me encanta hacer el tonto contigo en cualquier lado',
      foto: 'fotos/juntos peluches.jpg',
      ubicacion: 'https://www.google.com/maps/place/Carrefour/@40.3860597,-3.7668085,17z/data=!3m1!5s0xd418840a7c6f483:0x7edf0a3a627f0afc!4m14!1m7!3m6!1s0xd418840a7baa8d9:0xf403be35678f91e7!2sCentro+Comercial+Plaza+Aluche!8m2!3d40.3860597!4d-3.7642336!16s%2Fg%2F11g5z_3d4k!3m5!1s0xd41883f4dcc3eeb:0x3b71e4bf4fa7b564!8m2!3d40.3864338!4d-3.7643726!16s%2Fg%2F11kb0y62tm?entry=ttu&g_ep=EgoyMDI2MTEyMi4wIKXMDSoASAFQAw%3D%3D'
    },
    21: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    },
    22: {
      texto: 'Aunque me mientas diciendo que salgo bien en las fotos pero bueno, te quiero mucho igualmente amor',
      foto: 'fotos/yo real madrid.jpg'
    },
    23: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    },
    24: {
      texto: 'Nuestro primer dia juntos',
      foto: 'fotos/foto juntos espejo 1.jpg',
      pendiente: true
    }
  };

  // Obtener hora oficial de España (Europe/Madrid)
  function obtenerHoraMadrid() {
    const ahoraStr = new Date().toLocaleString("en-US", { timeZone: "Europe/Madrid" });
    return new Date(ahoraStr);
  }

  // Generar copos de nieve en el fondo
  const nieve = document.getElementById('nieve');
  const copos = ['❄', '❅', '❆'];
  for (let i = 0; i < 24; i++) {
    const span = document.createElement('div');
    span.className = 'snowflake';
    span.textContent = copos[i % copos.length];
    span.style.left = Math.random() * 98 + '%';
    span.style.fontSize = (12 + Math.random() * 12) + 'px';
    span.style.animationDuration = (8 + Math.random() * 8) + 's';
    span.style.animationDelay = (Math.random() * 6) + 's';
    nieve.appendChild(span);
  }

  // Contador en tiempo real hasta las próximas 20:11 de España
  function actualizarContador() {
    const ahora = obtenerHoraMadrid();
    let objetivo = new Date(ahora);
    objetivo.setHours(HORA_APERTURA, MINUTO_APERTURA, 0, 0);
    if (ahora >= objetivo) {
      objetivo.setDate(objetivo.getDate() + 1);
    }
    const diff = objetivo - ahora;
    const h = Math.floor(diff / (1000 * 60 * 60));
    const m = Math.floor((diff / (1000 * 60)) % 60);
    const s = Math.floor((diff / 1000) % 60);
    document.getElementById('contador').innerHTML = `⏳ Próxima sorpresa en: ${h}h ${m}m ${s}s`;
  }
  setInterval(actualizarContador, 1000);
  actualizarContador();

  // Abrir carta de introducción
  function abrirIntro() {
    const zona = document.getElementById('zona-tarjeta');
    zona.innerHTML = `
      <div class="tarjeta">
        <h2>💌 Para ti, Lucero</h2>
        <p>Hola amor, este es el regalo que te queria dar, va a ser un poco tonteria pero bueno, ns si te gustara del todo o que pero bueno, mi regalo es dedicarte a ti mi primera aplicacion en si misma, no va a haber otra primera aplicacion y mejor porque como tú no hay dos. Como tu no hay dos porque eres lo primero que pienso al despertarme y lo ultimo que pienso al acostarme, me encantaria poder verte todos los días pero bueno, el destino nos ha separado pero por suerte tu cierto 12 de septiembre de este año a las 20:11 decidiste escribirme</p>
        <img src="fotos/foto conversa.jpg" alt="Conversación">
        <p>Eramos dos chavales (tu más que yo la verdad), aun lo somos pero ahora hemos aprendido un poco más el uno del otro y cada vez que se más de ti me gustas más, de verdad, estoy super orgulloso de ti, de que a pesar de todo sigues adelante, eres muy fuerte y que sigas adelante y tengas la razon de la mayorias de mis sonrisas en el día, mi mejor pensamiento y siempre estas en mis mejores momentos de la semana siempre y TE AMO A TI RIZOS, a ti y solo a ti, me vuelves lokito, muy lokito.</p>
        <p>Creo que todos estn hartos de que hable tanto de ti la verdad, te quiero mucho de verdad y seguro qeu vas a lograr todo lo que te propongas en la vida y vas a poder seguir adelante, yo voy a estar ahi para ti siempre.</p>
        <p>Este calendario la idea es que cada día te vas a encontrar una sorpresa distinta, a ver si te gustan y que sepas que estoy orgulloso de la persona en la que te has covertido, un beso a ti, a Doña Ruth, Don Jesusito y la Torre chulilla jajaja</p>
        <img src="fotos/foto juntos espejo 1.jpg" alt="Juntos espejo">
        <button class="btn-cerrar" onclick="cerrarTarjeta()">❌ Cerrar introducción</button>
      </div>
    `;
    zona.scrollIntoView({ behavior: 'smooth' });
  }

  // Abrir tarjeta de un día del calendario
  function abrirDia(dia) {
    const ahora = obtenerHoraMadrid();
    const momentoApertura = new Date(ahora.getFullYear(), MES_OBJETIVO - 1, dia, HORA_APERTURA, MINUTO_APERTURA, 0);
    const regalo = sorpresas[dia];
    const zona = document.getElementById('zona-tarjeta');

    let contenido = `<div class="tarjeta"><h2>🎁 Día ${dia}</h2>`;
    if (ahora >= momentoApertura) {
      if (regalo.texto) contenido += `<p>${regalo.texto}</p>`;
      if (regalo.foto) contenido += `<img src="${encodeURI(regalo.foto)}" alt="Sorpresa día ${dia}">`;
      if (regalo.video) contenido += `<video src="${encodeURI(regalo.video)}" controls playsinline></video>`;
      if (regalo.audio) contenido += `<audio src="${encodeURI(regalo.audio)}" controls></audio>`;
      if (regalo.ubicacion) contenido += `<a class="btn-mapa" href="${regalo.ubicacion}" target="_blank">📍 Ver ubicación en el mapa</a>`;
    } else {
      contenido += `<div class="aviso">Aún no es día ${dia} a las 20:11 🎅</div>`;
    }
    contenido += `<button class="btn-cerrar" onclick="cerrarTarjeta()">❌ Cerrar sorpresa</button></div>`;

    zona.innerHTML = contenido;
    zona.scrollIntoView({ behavior: 'smooth' });
  }

  function cerrarTarjeta() {
    document.getElementById('zona-tarjeta').innerHTML = '';
  }

  // Construir cuadrícula mezclada con alturas variadas
  const dias = Object.keys(sorpresas).map(Number).sort(() => Math.random() - 0.5);
  const cuadricula = document.getElementById('cuadricula');
  const hoy = obtenerHoraMadrid();

  dias.forEach(dia => {
    const regalo = sorpresas[dia];
    const btn = document.createElement('button');
    btn.className = 'btn-dia';

    const altura = dia === 24 ? 115 : [65, 80, 95][Math.floor(Math.random() * 3)];
    btn.style.height = altura + 'px';

    if (regalo.pendiente) {
      btn.classList.add('btn-pendiente');
    } else if (hoy.getMonth() + 1 === MES_OBJETIVO && hoy.getDate() === dia) {
      btn.classList.add('btn-hoy');
    }

    if (dia === 24) {
      btn.classList.add('btn-24');
      btn.innerHTML = `🎄<br>DÍA 24<br>🎄`;
    } else {
      btn.textContent = `Día ${dia}`;
    }

    btn.onclick = () => abrirDia(dia);
    cuadricula.appendChild(btn);
  });
</script>
</body>
</html>
